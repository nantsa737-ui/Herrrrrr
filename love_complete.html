<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Pour Toi ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: Arial, sans-serif; }

/* ───── PAGES ───── */
#page-landing {
  position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: radial-gradient(ellipse at center, #2d0020 0%, #150010 60%, #080006 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
  transition: opacity 1.2s ease;
  z-index: 10;
}
#page-landing.hidden { opacity: 0; pointer-events: none; }

#page-heart {
  position: absolute; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: black;
  opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease;
  z-index: 5;
}
#page-heart.visible { opacity: 1; pointer-events: all; }

/* ───── LANDING : DÉCO ───── */
.petals-bg { position: absolute; inset: 0; overflow: hidden; }
.petal {
  position: absolute;
  border-radius: 50% 0 50% 0;
  background: rgba(220, 50, 80, 0.4);
  animation: fall linear infinite;
}
@keyframes fall {
  0%   { transform: translateY(-30px) rotate(0deg); opacity: 0.8; }
  100% { transform: translateY(110vh) rotate(400deg); opacity: 0; }
}
.star {
  position: absolute; width: 2px; height: 2px;
  background: rgba(255,180,200,0.7); border-radius: 50%;
  animation: twinkle ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; transform: scale(1); }
  50%       { opacity: 0.9; transform: scale(1.8); }
}

/* ───── LANDING : CONTENU ───── */
.landing-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; gap: 28px;
}
.heart-icon {
  font-size: 90px;
  animation: heartbeat 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 18px rgba(220,50,80,0.9))
          drop-shadow(0 0 40px rgba(220,50,80,0.5));
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  14%     { transform: scale(1.22); }
  28%     { transform: scale(1); }
  42%     { transform: scale(1.12); }
  56%     { transform: scale(1); }
}
.landing-title {
  font-family: Georgia, serif;
  font-size: clamp(28px, 6vw, 46px);
  color: #fff; letter-spacing: 6px; text-align: center;
  text-shadow: 0 0 30px rgba(230,80,110,0.95), 0 0 70px rgba(230,80,110,0.4);
}
.landing-subtitle {
  font-family: Georgia, serif;
  font-size: clamp(13px, 2.5vw, 17px);
  color: rgba(255,170,180,0.65);
  letter-spacing: 2px; text-align: center; font-style: italic;
}
.click-btn {
  margin-top: 10px; padding: 15px 55px;
  background: transparent;
  border: 1.5px solid rgba(220,80,100,0.75);
  color: #ffb0bc;
  font-family: Georgia, serif;
  font-size: clamp(15px, 3vw, 20px);
  letter-spacing: 3px; cursor: pointer; border-radius: 50px;
  transition: all 0.35s ease;
  text-shadow: 0 0 12px rgba(220,80,100,0.7);
  box-shadow: 0 0 25px rgba(220,80,100,0.18), inset 0 0 20px rgba(220,80,100,0.06);
}
.click-btn:hover {
  border-color: rgba(220,80,100,1); color: #fff;
  box-shadow: 0 0 50px rgba(220,80,100,0.55), inset 0 0 30px rgba(220,80,100,0.12);
  transform: scale(1.06);
}
.click-btn:active { transform: scale(0.98); }
.music-note {
  position: absolute; bottom: 28px;
  font-size: 13px; color: rgba(255,170,180,0.4);
  letter-spacing: 1px; font-family: Georgia, serif; font-style: italic;
}

/* ───── PAGE CŒUR ───── */
#hcanvas {
  position: absolute;
  filter: drop-shadow(0 0 10px red)
          drop-shadow(0 0 20px red)
          drop-shadow(0 0 40px red);
}
.htext {
  position: absolute; top: 65%; width: 100%;
  text-align: center; font-size: 42px;
  color: white; letter-spacing: 2px;
}
</style>
</head>
<body>

<!-- ══════════════ PAGE ACCUEIL ══════════════ -->
<div id="page-landing">
  <div class="petals-bg" id="petals"></div>
  <div class="landing-content">
    <div class="heart-icon">❤️</div>
    <div class="landing-title">Pour Toi</div>
    <div class="landing-subtitle">quelque chose de spécial t'attend…</div>
    <button class="click-btn" onclick="goToHeart()">✦ Click here ✦</button>
  </div>
  <div class="music-note">♪ Harleys in Hawaii — Katy Perry ♪</div>
</div>

<!-- ══════════════ PAGE CŒUR ══════════════ -->
<div id="page-heart">
  <canvas id="hcanvas"></canvas>
  <div class="htext" id="htext"></div>
</div>

<!-- AUDIO : place ton fichier mp3 dans le même dossier -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ── Pétales & étoiles ── */
const petalsContainer = document.getElementById('petals');
for (let i = 0; i < 35; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  const size = 6 + Math.random() * 12;
  p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size*1.6}px;animation-duration:${5+Math.random()*9}s;animation-delay:${Math.random()*12}s;opacity:${0.2+Math.random()*0.5};`;
  petalsContainer.appendChild(p);
}
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
  petalsContainer.appendChild(s);
}

/* ── Musique au premier clic ── */
const music = document.getElementById('music');
document.body.addEventListener('click', () => {
  music.play().catch(() => {});
}, { once: true });

/* ── Transition vers la page cœur ── */
function goToHeart() {
  music.play().catch(() => {});
  document.getElementById('page-landing').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('page-heart').classList.add('visible');
    startHeart();
  }, 400);
}

/* ══════════════ ANIMATION CŒUR ══════════════ */
function startHeart() {
  const canvas = document.getElementById('hcanvas');
  const ctx    = canvas.getContext('2d');
  const textEl = document.getElementById('htext');

  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [], progress = 0, pulse = 0, exploded = false, started = false;

  function heart(t) {
    return {
      x:  16 * Math.pow(Math.sin(t), 3),
      y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))
    };
  }

  for (let i = 0; i < 1500; i++) {
    const t = Math.random() * Math.PI * 2;
    const pos = heart(t);
    particles.push({ baseX: pos.x, baseY: pos.y,
                     x: canvas.width/2, y: canvas.height/2, vx: 0, vy: 0 });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pulse += 0.08;
    const beat = Math.sin(pulse) * 1.5;

    if (!exploded) {
      progress += (1.2 - progress) * 0.05;
      particles.forEach(p => {
        const scale = (15 + beat) * progress;
        const tx = canvas.width/2  + p.baseX * scale;
        const ty = canvas.height/2 + p.baseY * scale;
        p.x += (tx - p.x) * 0.08;
        p.y += (ty - p.y) * 0.08;
        ctx.fillStyle = 'red';
        ctx.fillRect(p.x, p.y, 2, 2);
      });
      if (progress > 0.9) typeWriter('I miss you ❤️', 80);
      if (progress > 1.0) explode();
    } else {
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.98; p.vy *= 0.98;
        ctx.fillStyle = 'red';
        ctx.fillRect(p.x, p.y, 2, 2);
      });
    }
    requestAnimationFrame(draw);
  }

  function explode() {
    exploded = true;
    particles.forEach(p => {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    });
  }

  function typeWriter(text, speed) {
    if (started) return;
    started = true;
    let i = 0;
    function typing() {
      if (i < text.length) {
        textEl.innerHTML += text.charAt(i++);
        setTimeout(typing, speed);
      }
    }
    typing();
  }

  draw();
}
</script>
</body>
</html>
